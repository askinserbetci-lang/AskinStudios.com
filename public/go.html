<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Be Mine Tonight · Aşkın Şerbetçi</title>
<meta property="og:title" content="Be Mine Tonight · 9-language duets with ney, kanun & oud" />
<meta property="og:description" content="Listen on YouTube, starting at your language." />
<meta property="og:image" content="https://i.ytimg.com/vi/7pAdFokQahM/maxresdefault.jpg" />
<meta name="robots" content="noindex" />
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #07060a; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 18px; padding: 16px 28px; background: #ff0033; color: #fff; text-decoration: none; font-weight: 600; border-radius: 4px; }
  #player iframe, iframe#player { width: 100%; height: 100%; }
  p { color: #dfba6b; letter-spacing: .2em; font-size: 11px; text-transform: uppercase; }
</style>
</head>
<body>
<div>
  <p>Aşkın Şerbetçi · Be Mine Tonight</p>
  <h1 id="title" style="font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:34px;margin:6px 0 4px"></h1>
  <div id="line" style="color:#ffffff99;font-size:15px;margin-bottom:18px"></div>
  <div style="position:relative;width:min(92vw,720px);aspect-ratio:16/9;margin:0 auto;border:1px solid #dfba6b55;background:#000">
    <div id="player" style="position:absolute;inset:0;width:100%;height:100%"></div>
  </div>
  <a id="open" href="#">▶ YouTube</a>
  <div><a id="here" href="#" style="background:none;color:#ffffff99;font-weight:400;font-size:14px;padding:8px"></a></div>
</div>
<script>
// The ad's "Watch more" button: opens the suite in the YouTube app (signed in, so like and
// subscribe are one tap) at the viewer's language; the music starts right here first, then
// Facebook's "leaving" box comes up over it.
(function () {
  var C = { en: 1614, tr: 1837, ar: 2114, ru: 2312, es: 2530, it: 2744, el: 2950, az: 3160, fr: 3364 };
  // Seconds into each duet where its hook (chorus) starts: the teaser here plays the hook;
  // the YouTube app still opens at the start of the duet
  var HOOK = { en: 0, tr: 0, ar: 0, ru: 0, es: 0, it: 0, el: 0, az: 0, fr: 0 };
  var q = new URLSearchParams(location.search), lq = String(q.get('lang') || '').trim().toLowerCase().slice(0, 2), l = C[lq] ? lq : 'en';
  var t = Number(q.get('t')) || C[l], V = '7pAdFokQahM', ua = navigator.userAgent;
  // Other songs through the same doorway: ?song=ch is My Crazy Heart (Arabic official video).
  // The teaser plays its chorus here; the YouTube app opens at the start of the song.
  var SONG = String(q.get('song') || '').toLowerCase(), teaser = t + (HOOK[l] || 0);
  if (SONG === 'ch') { V = 'W9IQFPJgq84'; t = 0; teaser = 80; }
  // Any video: ?v=<YouTube id>[&t=seconds] goes straight to that video in the YouTube app
  var VQ = String(q.get('v') || ''), DIRECT = SONG === 'ch';
  if (/^[\w-]{11}$/.test(VQ)) { V = VQ; t = Number(q.get('t')) || 0; DIRECT = true; }
  var path = 'www.youtube.com/watch?v=' + V + '&t=' + t + 's';
  var listen = SONG === 'ch' ? 'https://www.youtube.com/watch?v=' + V : location.origin + '/listen?lang=' + l + '&t=' + t;
  var app = /Android/i.test(ua)
    ? 'intent://' + path + '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' + encodeURIComponent(listen) + ';end'
    : /iPhone|iPad|iPod/i.test(ua) ? 'youtube://' + path : 'https://' + path;
  var T = {
    en: ['Be Mine Tonight', 'The English duet, live with ney, kanun and oud.'],
    tr: ['Anla Beni', 'Türkçe düet: ney, kanun ve ud ile canlı.'],
    ar: ['كوني لي الليلة', 'دويتو بالعربية مع الناي والقانون والعود، عزف حي.'],
    ru: ['Будь моей сегодня ночью', 'Русский дуэт: ней, канун и уд вживую.'],
    es: ['Sé mía esta noche', 'Dúo en español, en vivo con ney, kanun y oud.'],
    it: ['Sarai mia stanotte', 'Duetto in italiano, dal vivo con ney, kanun e oud.'],
    el: ['Να είσαι δική μου απόψε', 'Ελληνικό ντουέτο, ζωντανά με νέι, κανονάκι και ούτι.'],
    az: ['Bu gecə mənim ol', 'Azərbaycanca duet, ney, qanun və ud ilə canlı.'],
    fr: ['Sois à moi ce soir', 'Duo en français, en live avec ney, kanun et oud.']
  };
  document.getElementById('title').textContent = T[l][0];
  document.getElementById('line').textContent = T[l][1];
  if (SONG === 'ch') {
    document.getElementById('title').textContent = l === 'ar' ? 'قلبي المجنون' : 'My Crazy Heart';
    document.getElementById('line').textContent = l === 'ar' ? 'أغنية آشكن شربتجي الجديدة · My Crazy Heart' : 'Aşkın Şerbetçi · قلبي المجنون';
  }
  var dev = /Android/i.test(ua) ? 'android' : /iPhone|iPad|iPod/i.test(ua) ? 'ios' : 'other';
  // Step counter (a tiny image request to the app, nothing personal), to see where people drop off
  function step(ev) { try { new Image().src = 'https://aiqcreator.com/api/public/door?ev=' + ev + '&l=' + l + '&d=' + dev + '&s=' + (VQ && DIRECT && SONG !== 'ch' ? 'v' : (SONG || 'bmt')) + '&r=' + Math.random(); } catch (e) {} }
  var asked = false;
  step('arrive');
  // Crazy Heart (test from Oct 29): straight to YouTube, no teaser, the same way a direct ad link
  // works (those reached YouTube about 3x more often per dollar than the teaser page)
  if (DIRECT) {
    var web = 'https://youtu.be/' + V + (t ? '?t=' + t : '');
    // Android (most ad taps): open the YouTube app, where people are signed in and can like and subscribe.
    // Instagram/Facebook's in-app browser otherwise shows a muted, signed-out page full of pop-ups.
    if (dev === 'android') {
      step('away');
      var gone = false; document.addEventListener('visibilitychange', function () { if (document.hidden) gone = true; });
      setTimeout(function () { location.href = 'intent://www.youtube.com/watch?v=' + V + (t ? '&t=' + t + 's' : '') + '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' + encodeURIComponent(web) + ';end'; }, 150);
      setTimeout(function () { if (!gone) location.replace(web); }, 2600);
      return;
    }
    step('away'); setTimeout(function () { location.replace(web); }, 150); return;
  }
  var left = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && asked && !left) { left = true; step('away'); }
    else if (!document.hidden && left) { step('back'); }
  });
  document.getElementById('open').addEventListener('click', function () { asked = true; step('tap'); });
  document.getElementById('open').href = app;
  var here = document.getElementById('here'); here.href = SONG ? location.origin + '/#fans' : listen; here.addEventListener('click', function () { step('fan'); });
  here.textContent = '♡ ' + ({ en: 'Join the fan list', tr: 'Hayran listesine katıl', ar: 'انضم إلى قائمة المعجبين', ru: 'Список поклонников', es: 'Únete a la lista de fans', it: 'Entra nella lista dei fan', el: 'Λίστα θαυμαστών', az: 'Fan siyahısına qoşulun', fr: 'Rejoins la liste des fans' })[l];
  if (l === 'ar') document.documentElement.dir = 'rtl';
  if (!/Android|iPhone|iPad|iPod/i.test(ua)) { location.replace(app); return; }
  // A teaser: the song plays here for 30 seconds, then the YouTube app is offered (after 4s
  // if the phone won't autoplay), so Facebook's "leaving" box comes up over the music, not before it
  var played = false;
  function offer() { if (!asked) { asked = true; step('offer'); location.href = app; } }
  var noMusic = setTimeout(offer, 4000);
  window.onYouTubeIframeAPIReady = function () {
    new YT.Player('player', {
      videoId: V, playerVars: { start: teaser, autoplay: 1, playsinline: 1, rel: 0 },
      events: {
        onReady: function (e) { e.target.playVideo(); },
        onStateChange: function (e) { if (e.data === 1 && !played) { played = true; step('play'); } if (e.data === 1) { clearTimeout(noMusic); setTimeout(offer, 30000); } }
      }
    });
  };
  var tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
})();
</script>
</body>
</html>
